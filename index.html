<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>General Knowledge Quiz Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container home-screen">
      <h1 class="title">General Knowledge Quiz</h1>
      <p class="subtitle">Choose your level and test your brain power!</p>

      <div class="levels">
        <button class="level-btn" data-level="easy">Easy</button>
        <button class="level-btn" data-level="mid">Mid</button>
        <button class="level-btn" data-level="hard">Hard</button>
        <button class="level-btn" data-level="advanced">Advanced</button>
      </div>
    </div>

    <div class="container quiz hidden">
      <h2 id="level-title"></h2>
      <div id="question-container"></div>
      <div id="options-container"></div>

      <div class="quiz-controls">
        <button id="prev-btn" class="nav-btn">Previous</button>
        <button id="next-btn" class="nav-btn">Next</button>
      </div>
    </div>

    <div class="container result hidden">
      <h2>Your Score</h2>
      <p id="score"></p>
      <button id="home-btn" class="nav-btn">Back to Home</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
